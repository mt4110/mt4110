# mt4110 プロフィール README のグループ定義。
# グループ用トピックは各リポジトリに1つだけ付ける。
# 振り分けの優先順位は scripts/update_readme.py を参照。
# 一覧の並びは名前の昇順。日英対訳の説明は日本語側だけを残し、長い説明は読みやすい長さに切る。

owner: mt4110

# プロフィール用リポジトリ自身は一覧に出さない。
skip:
  - mt4110

groups:
  - id: veil
    title: veil シリーズ（セキュリティOSS）
    topic: group-veil
    order: 1
    collapsed: false
    blurb: シークレットの検出や共有、通信経路の観測など、ローカルで完結するセキュリティ向けのOSSです。

  - id: devtools
    title: 開発ツール
    topic: group-devtools
    order: 2
    collapsed: false
    blurb: CLI、テンプレート、CI や作業の補助など、開発の手元で使う道具です。

  - id: japan-data
    title: 日本向けデータ変換
    topic: group-japan-data
    order: 3
    collapsed: false
    blurb: 郵便番号や駅名など、日本の公開データを扱いやすくするための変換ツールです。

  - id: macos
    title: macOSアプリ
    topic: group-macos
    order: 4
    collapsed: false
    blurb: クラウド同期なしで使う、macOS向けのデスクトップアプリです。

  - id: lab
    title: 実験・研究
    topic: group-lab
    order: 5
    collapsed: false
    blurb: 検証用の試作と、お遊びのCLIです。研究・実験用として置いています。

  - id: archive
    title: アーカイブ
    topic: group-archive
    order: 6
    collapsed: true
    blurb: 開発を止めたリポジトリと、反例として残しているものです。

uncategorized:
  title: 未分類
  blurb: グループ用トピックがまだ付いていない公開リポジトリです。topic を付けると、次回の更新で各グループへ移ります。

# グループ用トピックも、アーカイブフラグも付いていないときだけ使う。
fallback:
  - prefix: "veil-"
    group_id: veil

